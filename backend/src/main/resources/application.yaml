server:
  port: 8080

spring:
  application:
    name: tracker
  datasource:
    url: jdbc:h2:file:./data/foodydb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:foody-tracker-local-development-secret-key-change-me}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
