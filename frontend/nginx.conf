# Port 8080: nginx-unprivileged runs as a non-root user and cannot bind 80.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers are repeated per location on purpose: a location-level
    # add_header discards every inherited one, so inheritance can't be trusted.

    # Hashed bundles: safe to cache forever.
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /health {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        default_type text/plain;
        return 200 'ok';
    }

    # SPA: client-side routes (e.g. /orders/1) fall back to index.html, which
    # must never be cached or a redeploy would point at deleted bundles.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
